<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Choisir mon répertoire</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Choisir un dossier d'images</h1>
    
    <div style="margin-bottom: 20px;">
        <input type="file" id="directory-picker" webkitdirectory mozdirectory directory />
        <p>Sélectionnez votre dossier (ex: Téléchargements)</p>
    </div>

    <div id="gallery" style="display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;"></div>

    <br>
    <a href="/">Retour à l'accueil</a>

    <script>
        const picker = document.getElementById('directory-picker');
        const gallery = document.getElementById('gallery');

        picker.addEventListener('change', e => {
            gallery.innerHTML = ''; // On vide la galerie actuelle
            
            // On parcourt tous les fichiers du dossier choisi
            for (const file of e.target.files) {
                // On vérifie si c'est une image
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    
                    reader.onload = function(event) {
                        const div = document.createElement('div');
                        div.style.background = "white";
                        div.style.padding = "10px";
                        div.style.borderRadius = "8px";
                        
                        const img = document.createElement('img');
                        img.src = event.target.result;
                        img.style.width = "200px";
                        img.style.borderRadius = "4px";
                        
                        const name = document.createElement('p');
                        name.textContent = file.name;
                        name.style.fontSize = "10px";
                        
                        div.appendChild(img);
                        div.appendChild(name);
                        gallery.appendChild(div);
                    }
                    
                    reader.readAsDataURL(file);
                }
            }
        });
    </script>
</body>
</html>
