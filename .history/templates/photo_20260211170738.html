<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sélection du dossier</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f0f2f5; text-align: center; padding: 50px; }
        .upload-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
        input[type="file"] { margin: 20px 0; }
        .btn-home { text-decoration: none; color: #1877f2; font-weight: bold; display: block; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="upload-card">
        <h1>Étape 1 : Choisir un dossier</h1>
        <p>Clique ci-dessous pour sélectionner un dossier de ton ordinateur :</p>
        
        <input type="file" id="dossier-image" webkitdirectory directory multiple>
        
        <div id="status" style="margin-top: 15px; color: #555;"></div>
    </div>

    <a href="/" class="btn-home">Retour à l'accueil</a>

    <script>
        const input = document.getElementById('dossier-image');
        const status = document.getElementById('status');

        input.addEventListener('change', function(e) {
            const fichiers = e.target.files;
            if (fichiers.length > 0) {
                // On affiche juste combien de fichiers ont été trouvés pour l'instant
                status.innerText = fichiers.length + " fichiers détectés dans ce dossier.";
                console.log("Dossier sélectionné :", fichiers[0].webkitRelativePath.split('/')[0]);
            }
        });
    </script>
</body>
</html>
