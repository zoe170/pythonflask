<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Visualiseur de Photos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Ma Galerie Interactive</h1>

    <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; width: 80%;">
        <h3>1. Choisir le répertoire</h3>
        <form method="POST">
            <input type="text" name="chemin_dossier" value="{{ dossier }}" placeholder="C:\Users\Nom\Pictures" style="width: 70%; padding: 8px;">
            <button type="submit">Charger le dossier</button>
        </form>
    </div>

    {% if images %}
    <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; width: 80%;">
        <h3>2. Sélectionner une photo</h3>
        <form method="POST">
            <input type="hidden" name="chemin_dossier" value="{{ dossier }}">
            
            <select name="menu_photos" style="width: 70%; padding: 8px;">
                <option value="">-- Choisissez une image --</option>
                {% for img in images %}
                <option value="{{ img }}" {% if img == photo_finale %}selected{% endif %}>{{ img }}</option>
                {% endfor %}
            </select>
            <button type="submit">Visualiser</button>
        </form>
    </div>
    {% endif %}

    {% if photo_finale %}
    <div style="margin-top: 20px;">
        <h3>Résultat :</h3>
        <img src="{{ url_for('image_externe', filename=photo_finale, dir=dossier) }}" 
             style="max-width: 100%; border: 5px solid white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        <p>{{ photo_finale }}</p>
    </div>
    {% endif %}

    <br>
    <a href="/">Retour à l'accueil</a>
</body>
</html>
