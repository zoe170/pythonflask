<!DOCTYPE html>
<html>

<head>
    <title>Carte de localisation</title>
    <meta charset="utf-8" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    

    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <a href="/" class="btn-retour">Retour à l'accueil</a>

    <script>
        // Création de la carte centrée sur une position
        var map = L.map('map').setView([50.75, 2.30], 9);

        // Ajout des tuiles OpenStreetMap
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Ajout des marqueurs
        L.marker([50.372734, 3.5213837]).addTo(map).bindPopup('Rubika (Valenciennes)');;
        L.marker([50.952, 1.881]).addTo(map).bindPopup('ULCO - FCU de Calais');
        L.marker([50.86517, 1.86847]).addTo(map).bindPopup('Collège les 4 vents (Guînes)');
    </script>

</body>

</html>
